<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>do while</title>
</head>
<body>
  <script>
    let num = 0;    // initialization
    do {
      console.log(num);
      num++; // updating 
    }
    while (false);  // condition
    
  </script>
</body>
</html>
