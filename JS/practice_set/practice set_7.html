<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objects</title>
</head>
<body>
  <script>
    

    let product = {
      size: 'S',
      name: 'Jeans',
      fit: 'Slim Fit',
      'delivery-time': 'Same day delivery',
    };
   

    // let copyProduct = product;
    // console.log(product);
    // copyProduct.size = 'M'
    // console.log(product);
    // copyProduct.fit = 'Regular Fit';
    // console.log(product);

    console.log(product['delivery-time']);

    let obj= {
      message: 'Good Job',
      status: 'Complete',
    };
    console.log(obj);
    let {message,status} = obj;
    console.log(message);
    console.log(status);

    function isIdenticalProduct(product1,product2)
    {
      if (product1 == product2) {
        return true;
      }
      if (typeof product1 != 'object') {
        console.warn('Parameter passed was not an object');
        return false;
      }

      if (product1 == product2) {
        return true;
      }
      if (product.name ===product2.name &&
        product.size ===product2.name &&
        product.fit ===product2.name){
          return true;
        }
        else {
          return false;
        }
    }

    let product2 = {
      size: 'S',
      name: 'Jeans',
      fit: 'Slim Fit',
      'delivery-time': 'Same day delivery',
    };

    let product3 = {
      size: 'S',
      name: 'Jeans',
      fit: 'Slim Fit',
      'delivery-time': 'Same day delivery',
    };
    console.log(isIdenticalProduct(product,''));
    console.log(isIdenticalProduct(product,product));
    console.log(isIdenticalProduct(product3,product2));
    console.log(isIdenticalProduct(product2,product3));


  </script>
  
</body>
</html>
