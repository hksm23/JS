<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <script>
    // let alarm = function() {
    //   console.log('Good morning');
    // };
    // setTimeout(alarm,2000);

    let alarm = () => console.log(`Good Morning ${new Date()}`);

    let intervalId =  setInterval(alarm, 1000);
